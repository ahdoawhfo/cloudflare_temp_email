name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          for required_secret in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN WRANGLER_TOML_CONTENT; do
            if [ -z "${!required_secret}" ]; then
              secret_name="$required_secret"
              if [ "$required_secret" = "WRANGLER_TOML_CONTENT" ]; then
                secret_name="BACKEND_TOML"
              fi
              echo "::error::Missing required GitHub secret for backend deploy: ${secret_name}"
              exit 1
            fi
          done

          # ✅ 修复核心：使用环境变量写入，避免 Shell 解析特殊字符
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          if ! grep -qE '^[[:space:]]*main[[:space:]]*=' wrangler.toml; then
            echo "::error::Invalid BACKEND_TOML: missing Worker entrypoint, e.g. main = \"src/worker.ts\""
            exit 1
          fi
          
          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            if grep -qE "^[[:space:]]*const[[:space:]]+\\{[[:space:]]*parse_message_wrapper[[:space:]]*\\}.*mail-parser-wasm-worker" src/common.ts; then
              echo "mail-parser-wasm-worker patch already present"
            elif git apply --check ../.github/config/mail-parser-wasm-worker.patch; then
              git apply ../.github/config/mail-parser-wasm-worker.patch
              echo "Applied mail-parser-wasm-worker patch"
            else
              echo "::error::Unable to apply mail-parser-wasm-worker patch. Check worker/src/common.ts against .github/config/mail-parser-wasm-worker.patch"
              exit 1
            fi
          fi

          if [ "$debug_mode" = "true" ]; then
            pnpm run deploy
          else
            set +e
            pnpm run deploy > deploy.log 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "Deploy succeeded"
            else
              echo "Command failed with exit code $code"
              echo "::group::Deploy error log (redacted)"
              grep -v "Environment Variable" deploy.log | tail -n 160
              echo "::endgroup::"
              exit "$code"
            fi
          fi
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ✅ 将 secret 映射到环境变量中
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
