name: Upstream Sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Merge latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    permissions:
      contents: write

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream changes
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main

          current_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"

          echo "Target main:   ${current_sha}"
          echo "Upstream main: ${upstream_sha}"

          merge_needed=false
          merge_status=0
          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            merge_needed=true
            set +e
            merge_result="$(git merge-tree --write-tree "$current_sha" "$upstream_sha")"
            merge_status=$?
            set -e
            if [ "$merge_status" -gt 1 ]; then
              echo "::error::Unable to compute upstream merge"
              exit "$merge_status"
            fi
            # merge-tree does not require a Git author/committer identity.
            git read-tree "${merge_result%%$'\n'*}"
            conflict_paths="$(printf '%s\n' "$merge_result" | awk -F '\t' '/^[0-9]+ [0-9a-f]+ [123]\t/ {print $2}' | sort -u)"
            if [ "$merge_status" -eq 1 ] && [ -z "$conflict_paths" ]; then
              echo "::error::Merge conflict output is not recognized; manual review required"
              exit 1
            fi
            printf '%s\n' "$merge_result"
          fi

          fork_owned_paths=(
            ".github/workflows/sync.yaml"
            ".github/config/upstream-sync-heartbeat"
            "frontend/.env.pages"
            "scripts/test-upstream-sync.py"
            "scripts/upload-sync-tree.py"
            "vitepress-docs/docs/zh/guide/actions/fork-upstream-sync.md"
            "vitepress-docs/docs/en/guide/actions/fork-upstream-sync.md"
            ".github/workflows/backend_deploy.yaml"
            ".github/workflows/frontend_deploy.yaml"
            ".github/workflows/frontend_pagefunction_deploy.yaml"
            ".github/workflows/tag_build.yml"
            ".github/config/mail-parser-wasm-worker.patch"
          )

          # Restore protected paths even when Git merges them cleanly.
          for path in "${fork_owned_paths[@]}"; do
            if git cat-file -e "$current_sha:$path" 2>/dev/null; then
              git restore --source="$current_sha" --staged -- "$path"
            else
              git rm --cached --ignore-unmatch -- "$path"
            fi
          done

          if [ "$merge_status" -ne 0 ]; then
            # Only known changelog conflicts are auto-resolved. Preserve the
            # fork's added entries in the upstream current-version section.
            for path in CHANGELOG.md CHANGELOG_EN.md; do
              if printf '%s\n' "$conflict_paths" | grep -Fxq "$path"; then
                python3 - "$path" "$current_sha" "$upstream_sha" <<'PYTHON'
          import subprocess, sys
          path, ours, theirs = sys.argv[1:]
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          base = git('merge-base', ours, theirs).strip()
          additions = git('diff', '--unified=0', base, ours, '--', path)
          entries = [line[1:] for line in additions.splitlines() if line.startswith('+- ')]
          content = git('show', f'{theirs}:{path}')
          entries = list(dict.fromkeys(entry for entry in entries if entry not in content))
          if entries:
              marker = '### Bug Fixes\n'
              if marker not in content:
                  raise SystemExit('Upstream changelog structure changed; manual review required')
              content = content.replace(marker, marker + '\n' + '\n'.join(entries) + '\n', 1)
          with open(path, 'w') as output:
              output.write(content)
          PYTHON
                git add -- "$path"
              fi
            done

            unresolved=false
            while IFS= read -r path; do
              case "$path" in
                CHANGELOG.md|CHANGELOG_EN.md) continue ;;
              esac
              protected=false
              for owned in "${fork_owned_paths[@]}"; do
                if [ "$path" = "$owned" ]; then protected=true; break; fi
              done
              if [ "$protected" = false ]; then
                echo "::error::Unresolved upstream conflict: $path; resolve manually before syncing"
                unresolved=true
              fi
            done < <(printf '%s\n' "$conflict_paths")
            if [ "$unresolved" = true ]; then exit 1; fi
          fi

          # Scheduled runs alone do not count as repository activity. A weekly
          # heartbeat commit also keeps syncing alive when upstream is quiet.
          mkdir -p .github/config
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/config/upstream-sync-heartbeat
          git add -- .github/config/upstream-sync-heartbeat

          commit_message="chore: upstream sync heartbeat"
          parents=(-F "parents[]=$current_sha")
          if [ "$merge_needed" = true ]; then
            commit_message="chore: merge upstream main"
            parents+=(-F "parents[]=$upstream_sha")
          fi

          # Local merge objects do not exist on GitHub yet. Upload staged
          # blobs and build the remote tree before creating the commit.
          tree_sha="$(python3 scripts/upload-sync-tree.py)"
          merge_sha="$(gh api -X POST "repos/${TARGET_REPO}/git/commits" \
            -f message="$commit_message" \
            -f tree="$tree_sha" \
            "${parents[@]}" \
            --jq '.sha')"

          gh api -X PATCH "repos/${TARGET_REPO}/git/refs/heads/main" \
            -f sha="$merge_sha" -F force=false

          echo "Merged upstream main into target main: ${merge_sha}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          UPSTREAM_REPO: dreamhunter2333/cloudflare_temp_email
